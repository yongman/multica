plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'ai.multica.markdownscroll'
version = '1.0.0'

android {
  namespace 'ai.multica.markdownscroll'
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation project(':react-native-enriched-markdown')
}
